name: Supabase Local QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase database
        run: supabase start -x studio,mailpit,storage-api,imgproxy,edge-runtime,logflare,vector

      - name: Reset local database and apply every migration
        run: supabase db reset --local

      - name: Verify the fuel authorization guard exists
        run: |
          supabase db lint --local --schema public
          supabase db query --local "select to_regprocedure('public.enforce_fuel_authorization_limits()') is not null as guard_function_exists;" 

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
